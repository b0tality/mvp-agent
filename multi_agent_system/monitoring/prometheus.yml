# ============================================================================
# Prometheus 配置 - 多智能体应用开发系统
# ============================================================================

global:
  scrape_interval: 15s      # 默认抓取间隔
  evaluation_interval: 15s  # 默认评估间隔
  scrape_timeout: 10s       # 抓取超时

# ----------------------------------------------------------------------------
# 告警规则文件
# ----------------------------------------------------------------------------
rule_files:
  - "alerts/*.yml"

# ----------------------------------------------------------------------------
# 告警管理器
# ----------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# ----------------------------------------------------------------------------
# 抓取配置
# ----------------------------------------------------------------------------
scrape_configs:
  # --------------------------------------------------------------------------
  # Prometheus 自身监控
  # --------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --------------------------------------------------------------------------
  # 应用监控
  # --------------------------------------------------------------------------
  - job_name: 'multi-agent-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8000']
        labels:
          app: 'multi-agent-system'
          environment: 'production'

  # --------------------------------------------------------------------------
  # Node Exporter (系统指标)
  # --------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          app: 'node-exporter'

  # --------------------------------------------------------------------------
  # PostgreSQL 监控
  # --------------------------------------------------------------------------
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          app: 'postgres-exporter'

  # --------------------------------------------------------------------------
  # Redis 监控
  # --------------------------------------------------------------------------
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          app: 'redis-exporter'

  # --------------------------------------------------------------------------
  # Nginx 监控
  # --------------------------------------------------------------------------
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          app: 'nginx-exporter'

  # --------------------------------------------------------------------------
  # Celery 监控
  # --------------------------------------------------------------------------
  - job_name: 'celery-exporter'
    static_configs:
      - targets: ['celery-exporter:8888']
        labels:
          app: 'celery-exporter'
