# ============================================================================
# 多智能体应用开发系统 - Pull Request 检查工作流
# ============================================================================

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 并发控制
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ============================================================================
# 工作流任务
# ============================================================================
jobs:
  # --------------------------------------------------------------------------
  # PR 标签和大小检查
  # --------------------------------------------------------------------------
  pr-info:
    name: PR 信息检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 添加大小标签
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: 10
          s_label: 'size/s'
          s_max_size: 50
          m_label: 'size/m'
          m_max_size: 200
          l_label: 'size/l'
          l_max_size: 500
          xl_label: 'size/xl'
          fail_if_xl: false

  # --------------------------------------------------------------------------
  # 代码检查
  # --------------------------------------------------------------------------
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort
      
      - name: 运行 Ruff
        run: ruff check .
      
      - name: 运行 Black
        run: black --check .
      
      - name: 运行 isort
        run: isort --check-only .

  # --------------------------------------------------------------------------
  # 单元测试
  # --------------------------------------------------------------------------
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: 运行测试
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=agents \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
      - name: 上传覆盖率
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # --------------------------------------------------------------------------
  # 安全检查
  # --------------------------------------------------------------------------
  security:
    name: 安全检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 运行 CodeQL 分析
        uses: github/codeql-action/init@v2
        with:
          languages: python
      
      - name: 执行 CodeQL
        uses: github/codeql-action/analyze@v2

  # --------------------------------------------------------------------------
  # Docker 构建测试
  # --------------------------------------------------------------------------
  docker:
    name: Docker 构建测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 构建测试
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 代码覆盖率报告
  # --------------------------------------------------------------------------
  coverage:
    name: 覆盖率报告
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 下载覆盖率
        uses: actions/download-artifact@v3
        with:
          name: coverage
        continue-on-error: true
      
      - name: 覆盖率评论
        uses: orgoro/coverage@v3.1
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.8
          thresholdNew: 0.9
        continue-on-error: true

  # --------------------------------------------------------------------------
  # 自动审查请求
  # --------------------------------------------------------------------------
  auto-review:
    name: 自动审查请求
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, security, docker]
    if: success()
    
    steps:
      - name: 请求审查
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.pulls.createReviewRequest({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              reviewers: ['maintainer-username']
            });
