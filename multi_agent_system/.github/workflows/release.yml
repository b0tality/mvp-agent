# ============================================================================
# 多智能体应用开发系统 - 发布工作流
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: true
        type: string
      prerelease:
        description: '是否为预发布版本'
        required: false
        type: boolean
        default: false

# ============================================================================
# 环境变量
# ============================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ============================================================================
# 权限配置
# ============================================================================
permissions:
  contents: write
  packages: write
  discussions: write

# ============================================================================
# 工作流任务
# ============================================================================
jobs:
  # --------------------------------------------------------------------------
  # 验证发布
  # --------------------------------------------------------------------------
  validate:
    name: 验证发布
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 提取版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "发布版本: $VERSION"
      
      - name: 检查版本格式
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "错误: 版本号格式不正确 (应为 x.y.z)"
            exit 1
          fi
      
      - name: 检查标签是否存在
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "标签 $TAG 已存在"
          else
            echo "创建新标签: $TAG"
          fi

  # --------------------------------------------------------------------------
  # 运行测试
  # --------------------------------------------------------------------------
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: 运行测试
        run: |
          pytest tests/ -v --tb=short --cov=agents
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # --------------------------------------------------------------------------
  # 构建和推送 Docker 镜像
  # --------------------------------------------------------------------------
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, test]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 登录 Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !github.event.inputs.prerelease }}
      
      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

  # --------------------------------------------------------------------------
  # 生成变更日志
  # --------------------------------------------------------------------------
  changelog:
    name: 生成变更日志
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 获取上一个标签
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "上一个标签: $PREV_TAG"
      
      - name: 生成变更日志
        id: changelog
        run: |
          PREV_TAG="${{ steps.prev-tag.outputs.prev_tag }}"
          VERSION="${{ needs.validate.outputs.version }}"
          
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # 保存到文件
          echo "$CHANGELOG" > CHANGELOG.md
          
          # 设置输出
          EOF=$(dd if=/dev/bs=1 count=2 2>/dev/null)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
      
      - name: 上传变更日志
        uses: actions/upload-artifact@v3
        with:
          name: changelog
          path: CHANGELOG.md

  # --------------------------------------------------------------------------
  # 创建 GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: 创建 Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, build, changelog]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 下载变更日志
        uses: actions/download-artifact@v3
        with:
          name: changelog
      
      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "v${{ needs.validate.outputs.version }}"
          body: |
            ## 版本 v${{ needs.validate.outputs.version }}
            
            ### Docker 镜像
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}:latest
            ```
            
            ### 变更内容
            ${{ needs.changelog.outputs.changelog }}
            
            ### 安装
            ```bash
            pip install multi-agent-system==${{ needs.validate.outputs.version }}
            ```
            
            ---
            
            **完整变更日志**: https://github.com/${{ github.repository }}/compare/${{ needs.validate.outputs.tag }}...v${{ needs.validate.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 通知
  # --------------------------------------------------------------------------
  notify:
    name: 发送通知
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, release]
    if: success()
    
    steps:
      - name: 发送 Slack 通知
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#releases'
          text: |
            :rocket: 新版本发布!
            
            版本: v${{ needs.validate.outputs.version }}
            仓库: ${{ github.repository }}
            链接: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
