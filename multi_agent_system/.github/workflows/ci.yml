# ============================================================================
# 多智能体应用开发系统 - CI 工作流
# ============================================================================
# 触发条件：推送到 main/develop 分支或创建 Pull Request

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '*.md'
      - 'docs/**'

# 并发控制
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 环境变量
env:
  PYTHON_VERSION: '3.11'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

# ============================================================================
# 工作流任务
# ============================================================================
jobs:
  # --------------------------------------------------------------------------
  # 代码检查
  # --------------------------------------------------------------------------
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy flake8 black isort
          pip install -r requirements.txt
      
      - name: 运行 Ruff (代码检查)
        run: ruff check .
      
      - name: 运行 Black (格式检查)
        run: black --check .
      
      - name: 运行 isort (导入排序检查)
        run: isort --check-only .
      
      - name: 运行 Flake8 (代码规范)
        run: flake8 agents/ utils/ config/ --max-line-length=100
      
      - name: 运行 MyPy (类型检查)
        run: mypy agents/ utils/ config/ --ignore-missing-imports
        continue-on-error: true

  # --------------------------------------------------------------------------
  # 单元测试
  # --------------------------------------------------------------------------
  test-unit:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock
      
      - name: 运行单元测试
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=agents \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -m "not integration"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        if: matrix.python-version == '3.11'

  # --------------------------------------------------------------------------
  # 集成测试
  # --------------------------------------------------------------------------
  test-integration:
    name: 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-unit
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: 运行集成测试
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            --cov=agents \
            --cov-report=xml:coverage-integration.xml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
      
      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage-integration.xml
          flags: integration

  # --------------------------------------------------------------------------
  # 安全扫描
  # --------------------------------------------------------------------------
  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: 运行 Bandit (安全扫描)
        run: bandit -r agents/ -ll -ii
      
      - name: 运行 Safety (依赖安全检查)
        run: safety check --full-report
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Docker 构建测试
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker 构建测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-unit
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: multi-agent-system:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 文档构建
  # --------------------------------------------------------------------------
  docs:
    name: 文档构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 安装依赖
        run: |
          pip install mkdocs mkdocs-material
      
      - name: 构建文档
        run: mkdocs build --strict
        continue-on-error: true

  # --------------------------------------------------------------------------
  # 质量报告
  # --------------------------------------------------------------------------
  quality-report:
    name: 质量报告
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-unit, security]
    if: always()
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 下载覆盖率报告
        uses: actions/download-artifact@v3
        with:
          name: coverage
        continue-on-error: true
      
      - name: 生成质量报告
        run: |
          echo "## 代码质量报告" > report.md
          echo "" >> report.md
          echo "### 测试结果" >> report.md
          echo "- 单元测试: ${{ needs.test-unit.result }}" >> report.md
          echo "- 集成测试: ${{ needs.test-integration.result }}" >> report.md
          echo "- 安全扫描: ${{ needs.security.result }}" >> report.md
          echo "- Docker构建: ${{ needs.docker-build.result }}" >> report.md
      
      - name: 上传报告
        uses: actions/upload-artifact@v3
        with:
          name: quality-report
          path: report.md
