# ============================================================================
# 多智能体应用开发系统 - CD 工作流 (持续部署)
# ============================================================================
# 触发条件：推送到 main 分支或创建 Release

name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# 环境变量
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'

# ============================================================================
# 权限配置
# ============================================================================
permissions:
  contents: read
  packages: write
  id-token: write

# ============================================================================
# 工作流任务
# ============================================================================
jobs:
  # --------------------------------------------------------------------------
  # 构建和推送镜像
  # --------------------------------------------------------------------------
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 登录 Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # --------------------------------------------------------------------------
  # 部署到预发布环境
  # --------------------------------------------------------------------------
  deploy-staging:
    name: 部署到预发布环境
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment:
      name: staging
      url: https://staging.example.com
    
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 配置 AWS 凭证
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: 部署到 ECS (Staging)
        run: |
          # 更新 ECS 服务
          aws ecs update-service \
            --cluster multi-agent-staging \
            --service multi-agent-app \
            --force-new-deployment \
            --task-definition multi-agent-app:${{ github.sha }}
      
      - name: 等待部署完成
        run: |
          aws ecs wait services-stable \
            --cluster multi-agent-staging \
            --services multi-agent-app
      
      - name: 运行健康检查
        run: |
          for i in {1..10}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://staging.example.com/health)
            if [ "$response" = "200" ]; then
              echo "健康检查通过!"
              exit 0
            fi
            echo "等待服务启动... ($i/10)"
            sleep 10
          done
          echo "健康检查失败!"
          exit 1
      
      - name: 通知部署成功
        if: success()
        run: |
          echo "预发布环境部署成功!"
          # 可以添加 Slack/Teams 通知

  # --------------------------------------------------------------------------
  # 部署到生产环境
  # --------------------------------------------------------------------------
  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, deploy-staging]
    environment:
      name: production
      url: https://example.com
    
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 配置 AWS 凭证
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: 部署到 ECS (Production)
        run: |
          # 更新 ECS 服务
          aws ecs update-service \
            --cluster multi-agent-production \
            --service multi-agent-app \
            --force-new-deployment \
            --task-definition multi-agent-app:${{ github.sha }}
      
      - name: 等待部署完成
        run: |
          aws ecs wait services-stable \
            --cluster multi-agent-production \
            --services multi-agent-app
      
      - name: 运行健康检查
        run: |
          for i in {1..15}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://example.com/health)
            if [ "$response" = "200" ]; then
              echo "健康检查通过!"
              exit 0
            fi
            echo "等待服务启动... ($i/15)"
            sleep 10
          done
          echo "健康检查失败!"
          exit 1
      
      - name: 通知部署成功
        if: success()
        run: |
          echo "生产环境部署成功!"
          # 可以添加 Slack/Teams 通知

  # --------------------------------------------------------------------------
  # 数据库迁移
  # --------------------------------------------------------------------------
  db-migrate:
    name: 数据库迁移
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 安装依赖
        run: |
          pip install alembic psycopg2-binary
      
      - name: 运行数据库迁移
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # --------------------------------------------------------------------------
  # 回滚任务
  # --------------------------------------------------------------------------
  rollback:
    name: 回滚部署
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    
    steps:
      - name: 配置 AWS 凭证
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: 回滚 ECS 服务
        run: |
          # 获取上一个稳定的任务定义
          PREVIOUS_TASK=$(aws ecs list-task-definitions \
            --family-prefix multi-agent-app \
            --sort DESC \
            --max-items 2 \
            --query 'taskDefinitionArns[1]' \
            --output text)
          
          # 回滚到上一个版本
          aws ecs update-service \
            --cluster multi-agent-${{ github.event.inputs.environment || 'staging' }} \
            --service multi-agent-app \
            --task-definition $PREVIOUS_TASK
          
          echo "已回滚到: $PREVIOUS_TASK"
      
      - name: 通知回滚
        run: |
          echo "部署已回滚!"
          # 可以添加 Slack/Teams 通知
